<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Become the Golfer — 12-week tracker</title>
<style>
:root{--bg:#111312;--card:#1b1e1d;--card2:#232725;--line:#333937;--tx:#e8e6e1;--dim:#9d9a92;--acc:#7fb069;--warn:#e0a458;--bad:#d9705f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:17px;margin:0;font-weight:500}
.sub{color:var(--dim);font-size:13px;margin-top:2px}
nav{display:flex;gap:6px;padding:10px 16px 0}
nav button{flex:1;padding:9px;border:1px solid var(--line);background:var(--card);color:var(--dim);border-radius:8px;font-size:14px;cursor:pointer}
nav button[aria-pressed=true]{background:var(--card2);color:var(--tx);border-color:#4a524f}
main{padding:14px 16px 60px;max-width:820px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.lbl{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
h2{font-size:16px;margin:0 0 4px;font-weight:500}
h3{font-size:14px;margin:14px 0 6px;font-weight:500;color:var(--dim)}
ul{margin:6px 0;padding-left:20px}li{margin:3px 0}
.chk{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #262a29}
.chk:last-child{border:0}
.chk input{margin-top:4px;width:17px;height:17px;flex:none;accent-color:var(--acc)}
.chk.done span{text-decoration:line-through;color:var(--dim)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--dim);margin-right:5px}
.pill.cue{border-color:#4a6b3f;color:var(--acc)}
.pill.cp{border-color:#7a5a2a;color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
th,td{text-align:left;padding:6px 7px;border-bottom:1px solid #262a29;vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:12px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.wk{border:1px solid var(--line);border-radius:10px;margin-bottom:9px;overflow:hidden}
.wkh{padding:10px 12px;background:var(--card2);cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.wkh b{font-weight:500}
.wkb{padding:4px 12px 10px;display:none}
.wk.open .wkb{display:block}
textarea{width:100%;min-height:70px;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:13px/1.5 inherit;resize:vertical}
button.act{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;margin:4px 6px 0 0}
.note{color:var(--dim);font-size:13px}
.warn{color:var(--warn)}.bad{color:var(--bad)}.ok{color:var(--acc)}
code{background:var(--card2);padding:1px 5px;border-radius:4px;font-size:12px}
</style></head><body>
<header><h1>Become the Golfer</h1><div class="sub" id="hsub">12-week plan · 23 Nov 2026 to 14 Feb 2027</div></header>
<nav>
<button id="b-today" aria-pressed="true" onclick="setView('today')">Today</button>
<button id="b-plan" aria-pressed="false" onclick="setView('plan')">Plan</button>
<button id="b-data" aria-pressed="false" onclick="setView('data')">Data</button>
<button id="b-log" aria-pressed="false" onclick="setView('log')">Notes</button>
</nav>
<main id="main"></main>
<script>
const START="2026-11-23", END="2027-02-14";
const CHECKPOINTS={"2026-12-21":"Checkpoint 1 (after week 4)","2027-01-18":"Checkpoint 2 (after week 8)","2027-02-15":"Checkpoint 3 (after week 12)"};
const GATE={"2026-12-11":"Month gate: 7i and 9i median path -3.0 or better. Path only, off a regular session."};
const FLEX={"2026-12-25":"Flex day","2027-01-01":"Flex day"};
const PHASES=[
 {w:[1,4],name:"Foundation",lift:"Technique and full range. 3 reps in reserve. Loads held at the week 1 anchor.",
  cues:{1:"Cup less",2:"Cup less",3:"Arm hang at address",4:"Arm hang at address"}},
 {w:[5,8],name:"Load increases",lift:"Add about 5% or 1-2 reps when all sets come in clean. 2 reps in reserve.",
  cues:{5:"Coach to set",6:"Coach to set",7:"Coach to set",8:"Coach to set"}},
 {w:[9,12],name:"Transfer",lift:"Lighter loads, fast intent, rotational power. 2 reps in reserve.",
  cues:{9:"Coach to set",10:"Coach to set",11:"Coach to set",12:"Coach to set"}}];
const DAYS=[
 {d:1,n:"Monday",t:"bay",label:"Bay session",mins:"60"},
 {d:2,n:"Tuesday",t:"A",label:"Workout A — heavy legs and core",mins:"60"},
 {d:3,n:"Wednesday",t:"B",label:"Workout B — upper body and rotation",mins:"60"},
 {d:4,n:"Thursday",t:"bay",label:"Bay session",mins:"60"},
 {d:5,n:"Friday",t:"C",label:"Workout C — moderate full body",mins:"60"},
 {d:6,n:"Saturday",t:"sbay",label:"Short bay — one block",mins:"30-40"},
 {d:7,n:"Sunday",t:"round",label:"18 holes at the bay",mins:"90 + 2 h walk"}];
const STEPS={
 bay:["Warm-up 10 min — uncounted, never exported",
  "Driver block, 10-15 shots. Current cue only.",
  "7-iron block, 10-15 shots. Current cue only.",
  "Stop a block if smash drops 0.05 below block 1, or the last 5 are 1.8 deg more out-to-in than the first 5",
  "THEN the drill block: 9i or wedge, partial speed, 8-10 reps. Logged separately.",
  "Export the session JSON and bring it to Claude with the master file"],
 sbay:["Warm-up 10 min",
  "ONE block only — driver or 7-iron, not both",
  "Same stop rules",
  "Drill block after, if there is time",
  "Export the JSON"],
 A:[],B:[],C:[],
 round:["Play 18 in the bay - 90 min",
  "Export it, but tag it as a ROUND. Round shots never pool with block shots.",
  "Log the score and anything patterned",
  "Walk 2 hours - separate from the round, outside the session budget",
  "In spring these combine: one 4 hour round walking the course with clubs"]};
const WA=["Warm-up 5-10 min: no-ball golf reps, hips, T-spine",
  "Goblet squat - 3 x 8-10, 3 RIR (one DB at chest, box or chair behind as depth target)",
  "Dumbbell RDL - 3 x 8-10, 3 RIR (two DBs, hinge to mid-shin, flat back)",
  "Split squat, rear foot on floor - 2 x 8 per side, 3 RIR",
  "Suitcase carry - 3 x 30-40 sec per side (one DB, ribs down)",
  "Pallof press - 3 x 10 per side (band at chest height)",
  "Dead bug - 2 x 8 per side",
  "Log load, sets, reps and RIR",
  "Nothing heavy touches the legs again before Thursday"];
const WB=["Warm-up 5-10 min: no-ball golf reps, hips, T-spine",
  "One-arm DB row - 3 x 8-12 per side, 2 RIR (hand on box or chair)",
  "DB floor press - 3 x 8-12, 2 RIR (two DBs, lying on the mat)",
  "Band chop, high to low - 3 x 10 per side",
  "Half-kneeling band lift, low to high - 2 x 10 per side",
  "Band pull-apart - 2 x 15 (light band)",
  "Open book T-spine rotation - 2 x 8 per side",
  "Log load, sets, reps and RIR"];
const WC=["Warm-up 5-10 min: no-ball golf reps, hips, T-spine",
  "DB deadlift from floor - 3 x 8, 4 RIR (light)",
  "Goblet box squat - 2 x 10 (70% or less of Tuesday's load)",
  "One-arm DB row - 3 x 10",
  "Push-up, hands on box if needed - 3 x 10",
  "Farmer carry - 3 x 30-40 sec (two DBs)",
  "Single-leg balance with rotational reach - 2 x 8 per side",
  "Log load, sets, reps and RIR"];
const POWER="Med ball rotational throw into a wall - 4 x 5 per side. Do this FIRST, while fresh, and drop one set of the carry.";
const DAILY=["3 mile hike - if time allows, outside the session budget","Log food"];
const MORNING="Warm-up: GolfForever 10-15 min (mobility, rotation, bands) - this is the warm-up, not an extra session";
function stepsFor(t,w){
 if(t==="A")return [MORNING+" - no heavy lower body today"].concat(w>=9?[POWER]:[]).concat(WA.slice(1));
 if(t==="B")return [MORNING].concat(WB.slice(1));
 if(t==="C")return [MORNING].concat(w>=9?[POWER]:[]).concat(WC.slice(1));
 return [MORNING].concat(STEPS[t]||[]);
}
const LOADNOTE="First session with the dumbbells: find loads. Per lift, work up until 8-10 reps leaves 3 in reserve. Two or three work-up sets maximum. Write the number down - that is your anchor, and the next three weeks run at it.";

function iso(d){return d.toISOString().slice(0,10)}
function addDays(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}
function dayIndex(s){return Math.round((new Date(s+"T12:00:00")-new Date(START+"T12:00:00"))/864e5)}
function weekOf(s){const i=dayIndex(s);return i<0?0:Math.floor(i/7)+1}
function phaseOf(w){return PHASES.find(p=>w>=p.w[0]&&w<=p.w[1])||PHASES[2]}
function fmt(s){const d=new Date(s+"T12:00:00");return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}

const CK="btg:v1";
let st={ticks:{},notes:{},lifts:{}};
try{st=Object.assign({ticks:{},notes:{},lifts:{}},JSON.parse(localStorage.getItem(CK))||{})}catch(e){}
function save(){try{localStorage.setItem(CK,JSON.stringify(st))}catch(e){}}
function tick(k,v){st.ticks[k]=v;save()}
function exKey(line){return line.split(" - ")[0].trim()}
function setLift(date,ex,f,v){st.lifts[date]=st.lifts[date]||{};
 st.lifts[date][ex]=Object.assign({},st.lifts[date][ex],{[f]:v});save()}
function lastLift(date,ex){
 const ds=Object.keys(st.lifts).filter(d=>d<date).sort().reverse();
 for(const d of ds){const e=st.lifts[d]&&st.lifts[d][ex];
  if(e&&(e.load||e.reps||e.rir))return {d,e}}
 return null}
function liftRow(date,line){
 const ex=exKey(line), cur=(st.lifts[date]||{})[ex]||{}, prev=lastLift(date,ex);
 const inp=(f,ph,w)=>`<input inputmode="decimal" value="${cur[f]||""}" placeholder="${ph}"
   onchange="setLift('${date}',${JSON.stringify(ex)},'${f}',this.value);render()"
   style="width:${w};background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:13px">`;
 let h=`<div style="display:flex;gap:6px;align-items:center;margin:4px 0 2px 26px;flex-wrap:wrap">
  ${inp("load","lb","58px")}${inp("reps","reps","58px")}${inp("rir","RIR","50px")}`;
 if(prev)h+=`<span class="note" style="font-size:12px">last ${prev.e.load||"?"} lb &times; ${prev.e.reps||"?"}, RIR ${prev.e.rir||"?"}</span>`;
 else h+=`<span class="note" style="font-size:12px">no previous</span>`;
 return h+`</div>`;
}

let view="today";
try{view=localStorage.getItem("btg:view")||"today"}catch(e){}
function setView(v){view=v;try{localStorage.setItem("btg:view",v)}catch(e){}
 ["today","plan","data","log"].forEach(x=>document.getElementById("b-"+x).setAttribute("aria-pressed",String(x===v)));render()}

function dayCard(date,opts){
 const w=weekOf(date), ph=phaseOf(w), di=((dayIndex(date)%7)+7)%7, day=DAYS[di];
 const cue=ph.cues[w]||"Coach to set";
 const cp=CHECKPOINTS[date], gate=GATE[date], flex=FLEX[date];
 let h=`<div class="card"><div class="lbl">${fmt(date)} · week ${w} of 12 · ${ph.name}</div>`;
 h+=`<h2>${day.label}</h2><div class="sub">${day.mins==="—"?"":day.mins+" min · "}`;
 h+=(day.t==="bay"||day.t==="sbay")?`<span class="pill cue">Cue: ${cue}</span>`:"";
 if(cp)h+=`<span class="pill cp">${cp}</span>`;
 if(gate)h+=`<span class="pill cp">Month gate</span>`;
 if(flex)h+=`<span class="pill">Flex day</span>`;
 h+=`</div>`;
 if(gate)h+=`<p class="warn note">${gate}</p>`;
 if(cp)h+=`<p class="warn note">Expanded protocol: 10 uncounted, driver 15, 7-iron 15 fresh and first, then the survey block (50&deg;, 9i, 5i, 5w) with one club promoted to 15 and the rest at 5.</p>`;
 if(flex)h+=`<p class="note">Move or skip this session. The week still works.</p>`;
 if("ABC".includes(day.t))h+=`<p class="note">${LOADNOTE}</p>`;
 const steps=stepsFor(day.t,w);
 const isLift="ABC".includes(day.t);
 h+=steps.map((s,i)=>{const k=date+":"+i,on=!!st.ticks[k];
  const row=`<label class="chk${on?" done":""}"><input type="checkbox" ${on?"checked":""} onchange="tick('${k}',this.checked);render()"><span>${s}</span></label>`;
  const logged=isLift&&/ - \d|x\d|RIR|sec/.test(s)&&!/^Warm-up|^Log load|^Nothing heavy/.test(s);
  return row+(logged?liftRow(date,s):"")}).join("");
 h+=`<h3>Every day</h3>`+DAILY.map((s,i)=>{const k=date+":d"+i,on=!!st.ticks[k];
  return `<label class="chk${on?" done":""}"><input type="checkbox" ${on?"checked":""} onchange="tick('${k}',this.checked);render()"><span>${s}</span></label>`}).join("");
 h+=`<h3>Notes</h3><textarea onchange="st.notes['${date}']=this.value;save()" placeholder="What you felt, what you changed, anything odd">${(st.notes[date]||"").replace(/</g,"&lt;")}</textarea>`;
 h+=`</div>`;
 return h;
}

function clamp(d){return d<START?START:d>"2027-02-15"?"2027-02-15":d}
let cur=null;
function curDate(){if(!cur)cur=clamp(iso(new Date()));return cur}
function goto_(d){cur=clamp(d);view="today";
 ["today","plan","data","log"].forEach(x=>document.getElementById("b-"+x).setAttribute("aria-pressed",String(x==="today")));
 try{localStorage.setItem("btg:view","today")}catch(e){}
 render();window.scrollTo(0,0)}
function step(n){goto_(addDays(curDate(),n))}

function progressFor(date){
 const di=((dayIndex(date)%7)+7)%7, t=(STEPS[DAYS[di].t]||[]).length+DAILY.length;
 let n=0;for(let i=0;i<(STEPS[DAYS[di].t]||[]).length;i++)if(st.ticks[date+":"+i])n++;
 for(let i=0;i<DAILY.length;i++)if(st.ticks[date+":d"+i])n++;
 return {n,t};
}

function viewToday(){
 const d=curDate(), today=clamp(iso(new Date()));
 let h=`<div class="card" style="padding:10px 12px">
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
   <button class="act" style="margin:0" onclick="step(-1)">&#9664; Prev</button>
   <input type="date" value="${d}" min="${START}" max="2027-02-15"
     onchange="goto_(this.value)"
     style="flex:1;min-width:140px;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px">
   <button class="act" style="margin:0" onclick="step(1)">Next &#9654;</button>
   <button class="act" style="margin:0${d===today?";opacity:.45":""}" onclick="goto_('${today}')">Today</button>
  </div>`;
 if(d!==today)h+=`<p class="note" style="margin:8px 0 0">Viewing ${fmt(d)} &mdash; ${d<today?"back-filling":"looking ahead"}. Ticks and notes save to this date.</p>`;
 h+=`</div>`;
 h+=dayCard(d);
 h+=`<div class="card"><div class="lbl">This week</div><table><tr><th>Day</th><th>Session</th><th class="n">Done</th></tr>`;
 const mon=addDays(START,(weekOf(d)-1)*7);
 for(let i=0;i<7;i++){const dd=addDays(mon,i);if(dd>"2027-02-15")break;
  const p=progressFor(dd), di=((dayIndex(dd)%7)+7)%7;
  const cls=p.n===p.t?"ok":p.n>0?"warn":"note";
  h+=`<tr style="cursor:pointer" onclick="goto_('${dd}')"><td>${fmt(dd)}${dd===d?' &#9664;':''}</td>
   <td>${DAYS[di].label}</td><td class="n ${cls}">${p.n}/${p.t}</td></tr>`}
 h+=`</table><p class="note">Tap any row to open that day. Session budget: one hour standard, 90 min Sunday. The hike and the Sunday walk sit outside it.</p></div>`;
 return h;
}

function viewPlan(){
 let h=`<div class="card"><div class="lbl">Dates</div><table>
 <tr><th>Milestone</th><th>Date</th></tr>
 <tr><td>Week 1 starts</td><td>Mon 23 Nov 2026</td></tr>
 <tr><td>Month gate (path only)</td><td>Fri 11 Dec 2026</td></tr>
 <tr><td>Checkpoint 1</td><td>Mon 21 Dec 2026</td></tr>
 <tr><td>Checkpoint 2</td><td>Mon 18 Jan 2027</td></tr>
 <tr><td>Week 12 ends</td><td>Sun 14 Feb 2027</td></tr>
 <tr><td>Checkpoint 3</td><td>Mon 15 Feb 2027</td></tr></table></div>`;
 h+=`<div class="card"><div class="lbl">Gear</div>
  <p class="note"><b>Need:</b> adjustable dumbbells, a pair to at least 50 lb each, 5 lb increments if you can get them. Resistance bands in several strengths, with handles and a door anchor. An exercise mat. A sturdy box, step or chair at 12-18 in.</p>
  <p class="note"><b>Before week 9:</b> a med ball, 8-10 lb, for rotational throws.</p>
  <p class="note"><b>For the bay:</b> a phone tripod or clamp and an alignment stick. The checkpoints need face-on and down-the-line video, and you cannot hold the phone and swing.</p>
  <p class="note"><b>Optional:</b> an adjustable bench. Nothing in the program requires one.</p>
  <p class="note">Lifting starts the week the dumbbells arrive. That week is the load-finding week, whatever the calendar says. The golf days are unaffected.</p></div>`;
 for(let w=1;w<=12;w++){
  const ph=phaseOf(w), s=addDays(START,(w-1)*7);
  const open=w===weekOf(iso(new Date()))?" open":"";
  h+=`<div class="wk${open}"><div class="wkh" onclick="this.parentNode.classList.toggle('open')">
   <span><b>Week ${w}</b> <span class="note">${fmt(s)} &ndash; ${fmt(addDays(s,6))}</span></span>
   <span class="note">${ph.name}</span></div><div class="wkb">
   <p class="note">Cue: ${ph.cues[w]}. Lifting: ${ph.lift}</p><table><tr><th>Day</th><th>Session</th><th>Flag / done</th></tr>`;
  for(let i=0;i<7;i++){const dt=addDays(s,i);
   const f=CHECKPOINTS[dt]?"Checkpoint":GATE[dt]?"Month gate":FLEX[dt]?"Flex":"";
   const pg=progressFor(dt);
   h+=`<tr style="cursor:pointer" onclick="goto_('${dt}')"><td>${fmt(dt)}</td><td>${DAYS[i].label}</td>
    <td class="warn">${f||(pg.n?`<span class="${pg.n===pg.t?'ok':'warn'}">${pg.n}/${pg.t}</span>`:"")}</td></tr>`}
  h+=`</table></div></div>`}
 return h;
}

let MASTER=null;
function viewData(){
 if(!MASTER)return `<div class="card"><div class="lbl">Data</div>
  <p class="note">No data loaded. The page looks for <code>data/golf-trackman-data-master.json</code> alongside itself. If that file is not published, pick it off this device instead &mdash; it stays in this browser and is not uploaded anywhere.</p>
  <label class="act" style="display:inline-block">Load master data file
   <input type="file" accept=".json,application/json" style="display:none" onchange="loadMaster(this.files[0])"></label></div>`;
 const rows=[];
 MASTER.sessions.forEach(s=>{if(s.type==="round")return;
  Object.entries(s.clubs||{}).forEach(([c,m])=>{
   const g=k=>m[k]&&m[k].median!==undefined?m[k].median:null;
   rows.push({date:s.date,club:c,src:s.dataSource,path:g("clubPath"),f2p:g("faceToPath"),
    off:g("impactOffsetMm"),low:g("lowPointMm"),pct:m.pctFaceWithin3??null})})});
 let h=`<div class="card"><div class="lbl">Session history</div><table>
 <tr><th>Date</th><th>Club</th><th class="n">Path</th><th class="n">F2P</th><th class="n">Offset mm</th><th class="n">Low pt mm</th><th class="n">% w/in 3</th><th>Source</th></tr>`;
 rows.forEach(r=>{
  const pc=r.path===null?"":(r.path>=-3?"ok":r.path>=-4?"warn":"bad");
  h+=`<tr><td>${r.date}</td><td>${r.club}</td>
  <td class="n ${pc}">${r.path??"—"}</td><td class="n">${r.f2p??"—"}</td>
  <td class="n">${r.off??"—"}</td><td class="n">${r.low??"—"}</td>
  <td class="n">${r.pct??"—"}</td><td class="note">${r.src}</td></tr>`});
 h+=`</table><p class="note">Path colour: green at -3.0 or better, amber to -4.0, red beyond. Noise lines — path 1.8&deg;, face-to-path 4.7&deg;, offset 14 mm, smash 0.05. A smaller change is not a change.</p></div>`;
 const f=MASTER.findings||[];
 if(f.length){h+=`<div class="card"><div class="lbl">Findings</div>`+
  f.map(x=>`<p class="note"><b>${x.topic}</b> &mdash; ${x.text}</p>`).join("")+`</div>`}
 const q=MASTER.openQuestions||[];
 if(q.length){h+=`<div class="card"><div class="lbl">Open questions</div><ul class="note">`+
  q.map(x=>`<li>${x}</li>`).join("")+`</ul></div>`}
 return h;
}

function viewLog(){
 const ks=Object.keys(st.notes).filter(k=>st.notes[k]&&st.notes[k].trim()).sort().reverse();
 let h=`<div class="card"><div class="lbl">Saved notes</div>`;
 h+=ks.length?ks.map(k=>`<p><b style="cursor:pointer" onclick="goto_('${k}')">${fmt(k)}</b><br><span class="note">${st.notes[k].replace(/</g,"&lt;").replace(/\n/g,"<br>")}</span></p>`).join(""):`<p class="note">No notes yet.</p>`;
 h+=`</div>`;

 const lds=Object.keys(st.lifts).filter(d=>Object.values(st.lifts[d]).some(e=>e.load||e.reps)).sort().reverse();
 if(lds.length){h+=`<div class="card"><div class="lbl">Lift log</div><table><tr><th>Date</th><th>Exercise</th><th class="n">Load</th><th class="n">Reps</th><th class="n">RIR</th></tr>`;
  lds.slice(0,12).forEach(d=>Object.entries(st.lifts[d]).forEach(([ex,e])=>{
   if(!(e.load||e.reps))return;
   h+=`<tr><td>${d}</td><td>${ex}</td><td class="n">${e.load||""}</td><td class="n">${e.reps||""}</td><td class="n">${e.rir||""}</td></tr>`}));
  h+=`</table></div>`}
 let done=0,tot=0;
 for(let i=0;i<84;i++){const p=progressFor(addDays(START,i));done+=p.n;tot+=p.t}
 h+=`<div class="card"><div class="lbl">Progress</div>
  <p>${done} of ${tot} items ticked across the 12 weeks.</p></div>`;
 h+=`<div class="card"><div class="lbl">Backup</div>
 <p class="note">Ticks and notes live in <b>this browser only</b>. They are not in the repo, not in the master data file, and not on any server. Export before you clear your browser or move to another device.</p>
 <button class="act" onclick="exportProgress()">Download progress file</button>
 <label class="act" style="display:inline-block">Load progress file
  <input type="file" accept=".json,application/json" style="display:none" onchange="importProgress(this.files[0])"></label>
 <button class="act" onclick="if(confirm('Erase all ticks and notes?')){st={ticks:{},notes:{},lifts:{}};save();render()}">Erase</button>
 <p class="note" style="margin-top:10px">Or copy this text out by hand:</p>
 <textarea id="bk">${JSON.stringify(st)}</textarea>
 <button class="act" onclick="restore()">Restore from the box</button></div>`;
 return h;
}
function exportProgress(){
 const b=new Blob([JSON.stringify(st,null,1)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(b);
 a.download="btg-progress-"+iso(new Date())+".json";a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importProgress(f){if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const v=JSON.parse(r.result);
  if(v&&v.ticks){st={ticks:v.ticks||{},notes:v.notes||{},lifts:v.lifts||{}};save();render();alert("Progress loaded.")}
  else alert("That file is not a progress backup.")}catch(e){alert("Could not read that file.")}};
 r.readAsText(f)}
function restore(){try{const v=JSON.parse(document.getElementById("bk").value);
 if(v&&v.ticks){st=v;save();render()}}catch(e){alert("That is not a valid backup.")}}

function render(){
 document.getElementById("main").innerHTML=
  view==="today"?viewToday():view==="plan"?viewPlan():view==="data"?viewData():viewLog();
}
function loadMaster(f){if(!f)return;const r=new FileReader();
 r.onload=()=>{try{MASTER=JSON.parse(r.result);try{localStorage.setItem("btg:master",r.result)}catch(e){}render()}
  catch(e){alert("That file is not valid JSON.")}};r.readAsText(f)}
try{const m=localStorage.getItem("btg:master");if(m)MASTER=JSON.parse(m)}catch(e){}
fetch("data/golf-trackman-data-master.json").then(r=>r.ok?r.json():null).then(j=>{if(j){MASTER=j;if(view==="data")render()}}).catch(()=>{});
setView(view);
</script></body></html>
